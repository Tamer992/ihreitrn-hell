# Vorschlag für die Sicherheits-Kopfzeilen der neuen Seite (Richtung Hell-Ruhig).
# NICHT automatisch übernommen. Ersetzt beim Livegang die add_header-Zeilen im
# Block "3. Die eigentliche Seite" von server/ihreitrn.de.conf der Live-Seite.
# Lokal getestet mit: node scripts/vorschau-csp.mjs 4373 server/vorschlag-kopfzeilen.conf
#
# Unterschiede zur heutigen Fassung:
# - script-src ohne die beiden alten Prüfsummen (die neue Seite hat kein Inline-Skript)
# - style-src ohne 'unsafe-inline' (kein Inline-CSS, keine style-Attribute)
# - img-src ohne data: (wird nicht gebraucht)
# - connect-src 'none', form-action 'none', manifest-src 'none' (kein Formular, kein Abruf)
# - neu: Cross-Origin-Opener-Policy und Cross-Origin-Resource-Policy
# - Permissions-Policy um weitere Geräte-Schnittstellen ergänzt
# - X-Frame-Options bleibt für ältere Browser, frame-ancestors 'none' ist die moderne Fassung

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), interest-cohort=(), browsing-topics=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; manifest-src 'none'; form-action 'none'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
